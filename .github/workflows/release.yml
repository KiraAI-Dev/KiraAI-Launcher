name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Set package version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --ignore-scripts
      - run: npm run dist:win
      - name: Remove unpacked application
        shell: pwsh
        run: Remove-Item -LiteralPath release/win-unpacked -Recurse -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --ignore-scripts
      - name: Create macOS application icon
        run: |
          mkdir -p build/icon.iconset
          sips -z 16 16 public/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32 public/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 public/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64 public/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 public/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256 public/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 public/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512 public/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 public/icon.png --out build/icon.iconset/icon_512x512.png
          sips -z 1024 1024 public/icon.png --out build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns
      - run: npm run dist:mac
      - name: Remove unpacked application
        run: rm -rf release/mac
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --ignore-scripts
      - run: npm run dist:linux
      - name: Remove unpacked application
        run: rm -rf release/linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
